name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check
        run: python -c "import ast, glob; files=glob.glob('**/*.py', recursive=True); [ast.parse(open(f, encoding='utf-8').read(), f) for f in files]; print('All', len(files), 'python files parse OK')"

      - name: Run tests
        run: python -m pytest tests -v
